repos:
  # 通用文件检查（官方 hooks 集）
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace    # 行尾多余空格
      - id: end-of-file-fixer      # 文件末尾空行
      - id: check-yaml             # YAML 语法
      - id: check-added-large-files  # 大文件（默认>500KB）警告

  # 我们的 Python 质检三件套
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff            # lint（--fix 自动修）
        args: [--fix]
      - id: ruff-format     # 格式化检查

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [src]         # 只查 src
        pass_filenames: false
