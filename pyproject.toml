[project]
name = "md-stats"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zkgit2021", email = "799423666@qq.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
md-stats = "md_stats.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]

[tool.ruff] # 配置ruff
src =["src", "tests"]  # 告诉 ruff 源码在哪
line-length = 100      # 每行最多 100 字符（团队约定）

[tool.ruff.lint] # 把规则配置固化到 pyproject.toml（推荐组合）：
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]          # 行宽问题交给 ruff format 管

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]       # 测试里用 assert 是正常的（如配了 S 安全规则）
